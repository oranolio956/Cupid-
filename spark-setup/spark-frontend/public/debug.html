<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Debug Mode - Spark</title>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
        // Initialize Eruda debugging console
        eruda.init();
        
        // Show a message
        console.log('🔍 Eruda Debug Console Loaded!');
        console.log('📱 You can now see all logs, errors, and network requests');
        console.log('👆 Tap the floating button in the bottom-right corner');
        
        // Redirect to main app after 3 seconds
        setTimeout(() => {
            console.log('Redirecting to main app...');
            window.location.href = '/';
        }, 3000);
    </script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2em;
            margin: 10px 0;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .note {
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Debug Mode Activated</h1>
        <p>Eruda debugging console is now loaded!</p>
        <div class="spinner"></div>
        <p>Redirecting to Spark in 3 seconds...</p>
        <div class="note">
            <strong>💡 Tip:</strong> Look for a floating button in the bottom-right corner.<br>
            Tap it to see console logs, errors, and network requests!
        </div>
    </div>
</body>
</html>
