<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CupidBot Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        font-family: 'Inter', sans-serif;
        background-color: #050505;
        color: #e4e4e7;
        overscroll-behavior-y: none;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
    </style>
</head>
  <body class="select-none">
    <div id="root">
      <!-- Loading fallback -->
      <div style="display: flex; align-items: center; justify-content: center; height: 100vh; background: #050505; color: #e4e4e7;">
        <div style="text-align: center;">
          <div style="width: 40px; height: 40px; border: 3px solid #3f3f46; border-top-color: #ef4444; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem;"></div>
          <p style="color: #a1a1aa; font-size: 0.875rem;">Loading dashboard...</p>
        </div>
      </div>
    </div>
    <style>
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="module" src="/index.tsx"></script>
    <noscript>
      <div style="display: flex; align-items: center; justify-content: center; height: 100vh; background: #050505; color: #e4e4e7; font-family: Inter, sans-serif;">
        <div style="text-align: center; padding: 2rem;">
          <h1 style="color: #ef4444; margin-bottom: 1rem;">JavaScript Required</h1>
          <p style="color: #a1a1aa;">Please enable JavaScript to use this dashboard.</p>
        </div>
      </div>
    </noscript>
  </body>
</html>
