services:
  - type: web
    name: cupid-activation-server
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DB_PATH
        value: /data/activations.db
    disk:
      name: activation-data
      mountPath: /data
      sizeGB: 1
